name = "reviewer"
description = "Automatically spawn after a writer or for an independent read-only audit of implementation, experiments, results, figures, citations, paper consistency, reproducibility, or defense readiness; never edit reviewed artifacts or approve Gates."
model_reasoning_effort = "high"
